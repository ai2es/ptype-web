# Builds web/ and publishes it to GitHub Pages.
# In the repository settings, set Pages > Source to "GitHub Actions" and add
# the data locations as repository variables (Settings > Secrets and variables
# > Actions > Variables): VITE_PTYPE_URL, VITE_SOUNDING_URL and, if the model
# is hosted outside the site, VITE_MODEL_URL and VITE_MODEL_META_URL.
name: Deploy web viewer

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_PTYPE_URL: ${{ vars.VITE_PTYPE_URL }}
          VITE_SOUNDING_URL: ${{ vars.VITE_SOUNDING_URL }}
          VITE_MODEL_URL: ${{ vars.VITE_MODEL_URL }}
          VITE_MODEL_META_URL: ${{ vars.VITE_MODEL_META_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
