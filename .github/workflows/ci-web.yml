# Runs the unit tests and builds web/ on every pull request, so a failure shows on the pull request
# instead of after the merge, when the deploy (deploy-web.yml) runs the same steps and stops the site
# from updating. That is what happened with pull request 16.
#
# Nothing is published from here and no repository variables are read: the build uses the default data
# URLs, which is enough to prove that the type-check and the bundling succeed.
name: Test and build web viewer

on:
  pull_request:
    paths: ['web/**', '.github/workflows/ci-web.yml', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
